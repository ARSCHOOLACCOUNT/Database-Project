<html>
<head>
<title>Edit Device</title>
</head>
<body>

<h1>Edit Device</h1>
<p>Edit/Update fields</p>

<form method="GET" action="/update">
<input type="hidden" name="deviceID" value="{{ device[0] }}">
Model Name: <input type="text" name="modelName" value="{{ device[1] }}" required><br>
Release Year: <input type="number" name="releaseYear" value="{{ device[2] }}" required><br>
Base Price: <input type="number" step="0.01" name="basePrice" value="{{ device[3] }}" required><br>
<input type="submit" value="Save Changes">
</form>

<p><a href="/result">Back to table</a></p>

</body>
</html>
